<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Product Barcode Scanner</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:620px;margin:auto;padding:28px 18px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 24px #00000012}h1{margin:0 0 8px}p,.status{color:#64748b;line-height:1.45}.camera{position:relative;overflow:hidden;border-radius:16px;background:#111827;aspect-ratio:3/4}.camera video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;inset:34% 8%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 999px #0003}.buttons{display:flex;gap:10px;margin-top:14px}button{flex:1;border:0;border-radius:10px;background:#111827;color:#fff;padding:13px;font:inherit;font-weight:800;cursor:pointer}.secondary{background:#fff;color:#111827;border:1px solid #cbd5e1}.result{display:grid;gap:10px}.result h2{margin:0;font-size:25px}.detail{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid #e2e8f0}.detail span{color:#64748b}.hidden{display:none!important}.manual{display:flex;gap:8px}.manual input{min-width:0;flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}.manual button{flex:0 0 auto}.error{color:#b91c1c}
  </style>
</head>
<body>
  <main class="page">
    <section class="card"><h1>Product Scanner</h1><p>Point the camera at a barcode generated by the Product Barcode Generator.</p><div class="camera"><video id="video" autoplay playsinline muted></video><div class="guide"></div></div><div id="status" class="status">Camera is not started.</div><div class="buttons"><button id="start" type="button">Start Camera</button><button id="scanAgain" class="secondary hidden" type="button">Scan Again</button></div></section>
    <section id="result" class="card result hidden"><h2 id="productName"></h2><div class="detail"><span>Batch</span><strong id="batchName"></strong></div><div class="detail"><span>Serial Number</span><strong id="serial"></strong></div><div class="detail"><span>MRP</span><strong id="price"></strong></div></section>
    <section class="card"><p>Manual test / scanner fallback:</p><div class="manual"><input id="manualCode" placeholder="Paste barcode data"><button id="lookup" type="button">Show</button></div></section>
  </main>
  <script>
    (() => {
      const video = document.getElementById('video'); const status = document.getElementById('status'); const result = document.getElementById('result');
      let stream, detector, timer, busy = false;
      async function start() {
        result.classList.add('hidden'); stop();
        if (!('BarcodeDetector' in window)) return setStatus('Barcode scanning is not supported in this browser. Use current Chrome on Android or the manual field below.', true);
        try {
          const formats = await BarcodeDetector.getSupportedFormats?.() || [];
          detector = formats.includes('code_128') ? new BarcodeDetector({formats:['code_128']}) : new BarcodeDetector();
          stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
          video.srcObject = stream; await video.play(); setStatus('Looking for a product barcode…'); document.getElementById('start').classList.add('hidden'); document.getElementById('scanAgain').classList.remove('hidden'); scan();
        } catch (error) { setStatus('Camera permission is required. Open this page in Chrome over HTTPS and allow Camera access.', true); }
      }
      async function scan() {
        if (!stream) return;
        try { const codes = await detector.detect(video); if (codes.length && showProduct(codes[0].rawValue)) { stop(); return; } }
        catch (error) { console.warn('Scan failed', error); }
        timer = setTimeout(scan, 180);
      }
      function stop() { clearTimeout(timer); if (stream) stream.getTracks().forEach(track => track.stop()); stream = null; video.srcObject = null; }
      function showProduct(raw) {
        try {
          const data = new URLSearchParams(raw);
          const name = data.get('P'), batch = data.get('B'), serial = data.get('S'), price = data.get('M');
          if (!name || !batch || !serial || !price) throw new Error('Unknown');
          document.getElementById('productName').textContent = name; document.getElementById('batchName').textContent = batch; document.getElementById('serial').textContent = serial; document.getElementById('price').textContent = price;
          result.classList.remove('hidden'); setStatus('Product found.'); return true;
        } catch { setStatus('This barcode was not created by the updated Product Barcode Generator.', true); return false; }
      }
      function setStatus(message, isError = false) { status.textContent = message; status.className = isError ? 'status error' : 'status'; }
      document.getElementById('start').onclick = start; document.getElementById('scanAgain').onclick = start;
      document.getElementById('lookup').onclick = () => showProduct(document.getElementById('manualCode').value.trim());
      window.addEventListener('pagehide', stop);
    })();
  </script>
</body>
</html>
